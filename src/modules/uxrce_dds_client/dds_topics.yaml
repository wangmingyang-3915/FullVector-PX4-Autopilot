#####
#
# This file maps all the topics that are to be used on the uXRCE-DDS client.
#
# rate_limit: maximum publish rate in Hz (higher = higher frequency)
# If rate_limit is not set, falls back to UXRCE_DEFAULT_POLL_INTERVAL_MS (10ms = 100Hz)
#####
publications:

  - topic: /fmu/out/manual_control_setpoint
    type: px4_msgs::msg::ManualControlSetpoint
    rate_limit: 50

  - topic: /fmu/out/vehicle_attitude
    type: px4_msgs::msg::VehicleAttitude
    rate_limit: 200

  - topic: /fmu/out/vehicle_angular_velocity
    type: px4_msgs::msg::VehicleAngularVelocity
    rate_limit: 200

  - topic: /fmu/out/vehicle_local_position
    type: px4_msgs::msg::VehicleLocalPosition
    rate_limit: 100

  - topic: /fmu/out/vehicle_land_detected
    type: px4_msgs::msg::VehicleLandDetected
    rate_limit: 20

  # Required by the FSM safety-exit gate to distinguish disarmed from armed.
  - topic: /fmu/out/vehicle_status
    type: px4_msgs::msg::VehicleStatus
    rate_limit: 20

  - topic: /fmu/out/hover_thrust_estimate
    type: px4_msgs::msg::HoverThrustEstimate
    rate_limit: 10

  - topic: /fmu/out/control_allocator_status
    type: px4_msgs::msg::ControlAllocatorStatus
    rate_limit: 50

# Create uORB::Publication
subscriptions:
  - topic: /fmu/in/target_relative_pose
    type: px4_msgs::msg::TargetRelativePose

  - topic: /fmu/in/offboard_control_mode
    type: px4_msgs::msg::OffboardControlMode

  - topic: /fmu/in/vehicle_thrust_setpoint
    type: px4_msgs::msg::VehicleThrustSetpoint

  - topic: /fmu/in/vehicle_torque_setpoint
    type: px4_msgs::msg::VehicleTorqueSetpoint

  - topic: /fmu/in/vehicle_command
    type: px4_msgs::msg::VehicleCommand

# Create uORB::PublicationMulti
subscriptions_multi:
