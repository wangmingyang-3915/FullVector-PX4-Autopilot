# src/modules/fullvector_control/module.yaml
module_name: fullvector_control

parameters:
  - group: Fullvector Control
    definitions:
      FV_POS_P_X:
        type: float
        default: 0.95
        decimal: 3
        min: 0.0
        max: 2.0
        description:
          short: X 轴位置比例增益
          long: |
            X 轴位置外环比例增益。
            增大该值会提高位置误差到内部期望速度的响应强度，但过大可能引起振荡。

      FV_POS_P_Y:
        type: float
        default: 0.95
        decimal: 3
        min: 0.0
        max: 2.0
        description:
          short: Y 轴位置比例增益
          long: |
            Y 轴位置外环比例增益。
            增大该值会提高位置误差到内部期望速度的响应强度，但过大可能引起振荡。

      FV_POS_P_Z:
        type: float
        default: 1.0
        decimal: 3
        min: 0.0
        max: 1.5
        description:
          short: Z 轴位置比例增益
          long: |
            Z 轴位置外环比例增益。
            增大该值会提高高度方向位置误差到内部期望速度的响应强度。

      FV_POS_I_X:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: X 轴位置积分增益
          long: |
            X 轴位置外环积分增益。
            用于逐步消除持续的位置偏差。

      FV_POS_I_Y:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: Y 轴位置积分增益
          long: |
            Y 轴位置外环积分增益。
            用于逐步消除持续的位置偏差。

      FV_POS_I_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: Z 轴位置积分增益
          long: |
            Z 轴位置外环积分增益。
            用于逐步消除持续的高度方向位置偏差。

      FV_POS_D_X:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: X 轴位置微分增益
          long: |
            X 轴位置外环微分增益。
            根据位置误差变化率抑制超调和快速变化。

      FV_POS_D_Y:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: Y 轴位置微分增益
          long: |
            Y 轴位置外环微分增益。
            根据位置误差变化率抑制超调和快速变化。

      FV_POS_D_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: Z 轴位置微分增益
          long: |
            Z 轴位置外环微分增益。
            根据高度误差变化率抑制超调和快速变化。

      FV_VEL_P_X:
        type: float
        default: 1.8
        decimal: 3
        min: 1.2
        max: 5.0
        description:
          short: X 轴速度比例增益
          long: |
            X 轴速度内环比例增益。
            当前用于把内部期望速度与估计速度的误差转换为期望加速度。

      FV_VEL_P_Y:
        type: float
        default: 1.8
        decimal: 3
        min: 1.2
        max: 5.0
        description:
          short: Y 轴速度比例增益
          long: |
            Y 轴速度内环比例增益。
            当前用于把内部期望速度与估计速度的误差转换为期望加速度。

      FV_VEL_P_Z:
        type: float
        default: 4.0
        decimal: 3
        min: 2.0
        max: 15.0
        description:
          short: Z 轴速度比例增益
          long: |
            Z 轴速度内环比例增益。
            当前用于把高度方向速度误差转换为期望加速度。

      FV_VEL_I_X:
        type: float
        default: 0.4
        decimal: 3
        min: 0.0
        max: 60.0
        description:
          short: X 轴速度积分增益
          long: |
            X 轴速度内环积分增益。
            用于补偿持续的速度跟踪误差。

      FV_VEL_I_Y:
        type: float
        default: 0.4
        decimal: 3
        min: 0.0
        max: 60.0
        description:
          short: Y 轴速度积分增益
          long: |
            Y 轴速度内环积分增益。
            用于补偿持续的速度跟踪误差。

      FV_VEL_I_Z:
        type: float
        default: 2.0
        decimal: 3
        min: 0.2
        max: 3.0
        description:
          short: Z 轴速度积分增益
          long: |
            Z 轴速度内环积分增益。
            用于补偿持续的垂向速度跟踪误差；定点模式会额外乘以 FV_PC_Z_I_SCALE。

      FV_PC_Z_I_SCALE:
        type: float
        default: 0.5
        decimal: 2
        min: 0.0
        max: 1.0
        description:
          short: 定点垂向积分增益缩放
          long: |
            仅在定点模式中缩放 FV_VEL_I_Z；0 关闭定点垂向积分，1 使用完整全局垂向积分增益。
            参数可通过地面站在 0 到 1 之间在线调整。
            Offboard、相对对接及其他控制模式继续使用未缩放的 FV_VEL_I_Z。

      FV_Z_VEL_BLEND:
        type: float
        default: 0.7
        decimal: 2
        min: 0.0
        max: 1.0
        description:
          short: 定点垂向速度融合权重
          long: |
            定点模式锁高时，z_deriv 在垂向速度反馈中的权重。
            0 只使用 EKF vz，1 只使用与位置 Z 一致的 z_deriv；用于减小两者静态偏差造成的积分残留。

      FV_Z_INT_MAX:
        type: float
        default: 0.6
        unit: m/s^2
        decimal: 2
        min: 0.1
        max: 0.6
        description:
          short: 定点垂向积分加速度上限
          long: |
            定点模式下 Z 轴速度积分项允许贡献的最大加速度绝对值。
            最高限制为 0.6 m/s^2；松杆重新锁高时最多保留该上限的一半，
            避免手动升降阶段的积分饱和直接带入锁高制动。

      FV_AW_GAIN:
        type: float
        default: 1.0
        unit: 1/s
        decimal: 2
        min: 0.0
        max: 10.0
        description:
          short: 分配饱和反算抗积分饱和增益
          long: |
            使用分配器实际可实现控制量与请求控制量之差，反算修正速度环和角速度环积分。
            0 关闭反算，值越大积分器从执行器饱和中退出越快。

      FV_VEL_D_X:
        type: float
        default: 0.2
        decimal: 3
        min: 0.1
        max: 2.0
        description:
          short: X 轴速度微分增益
          long: |
            X 轴速度内环微分增益。
            根据速度误差变化率抑制加速度指令突变。

      FV_VEL_D_Y:
        type: float
        default: 0.2
        decimal: 3
        min: 0.1
        max: 2.0
        description:
          short: Y 轴速度微分增益
          long: |
            Y 轴速度内环微分增益。
            根据速度误差变化率抑制加速度指令突变。

      FV_VEL_D_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 2.0
        description:
          short: Z 轴速度微分增益
          long: |
            Z 轴速度内环微分增益。
            根据垂向速度误差变化率抑制加速度指令突变。

      FV_ATT_P_X:
        type: float
        default: 6.5
        decimal: 3
        min: 0.0
        max: 12.0
        description:
          short: roll 姿态比例增益
          long: |
            roll 姿态外环比例增益。
            用于把 roll 角误差转换为期望角速度。

      FV_ATT_P_Y:
        type: float
        default: 6.5
        decimal: 3
        min: 0.0
        max: 12.0
        description:
          short: pitch 姿态比例增益
          long: |
            pitch 姿态外环比例增益。
            用于把 pitch 角误差转换为期望角速度。

      FV_ATT_P_Z:
        type: float
        default: 2.8
        decimal: 3
        min: 0.0
        max: 5.0
        description:
          short: yaw 姿态比例增益
          long: |
            yaw 姿态外环比例增益。
            用于把航向角误差转换为期望偏航角速度。

      FV_ATT_I_X:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: roll 姿态积分增益
          long: |
            roll 姿态外环积分增益。
            用于补偿持续的 roll 姿态偏差。

      FV_ATT_I_Y:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: pitch 姿态积分增益
          long: |
            pitch 姿态外环积分增益。
            用于补偿持续的 pitch 姿态偏差。

      FV_ATT_I_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: yaw 姿态积分增益
          long: |
            yaw 姿态外环积分增益。
            用于补偿持续的航向偏差。

      FV_ATT_D_X:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: roll 姿态微分增益
          long: |
            roll 姿态外环微分增益。
            根据 roll 误差变化率抑制姿态目标跟踪超调。

      FV_ATT_D_Y:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: pitch 姿态微分增益
          long: |
            pitch 姿态外环微分增益。
            根据 pitch 误差变化率抑制姿态目标跟踪超调。

      FV_ATT_D_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 10.0
        description:
          short: yaw 姿态微分增益
          long: |
            yaw 姿态外环微分增益。
            根据航向误差变化率抑制偏航超调。

      FV_ANG_VEL_P_X:
        type: float
        default: 0.15
        decimal: 3
        min: 0.01
        max: 0.5
        description:
          short: roll 角速度比例增益
          long: |
            roll 角速度内环比例增益。
            用于把期望角速度与估计角速度的误差转换为期望角加速度。

      FV_ANG_VEL_P_Y:
        type: float
        default: 0.15
        decimal: 3
        min: 0.01
        max: 0.6
        description:
          short: pitch 角速度比例增益
          long: |
            pitch 角速度内环比例增益。
            用于把期望角速度与估计角速度的误差转换为期望角加速度。

      FV_ANG_VEL_P_Z:
        type: float
        default: 0.25
        decimal: 3
        min: 0.0
        max: 0.6
        description:
          short: yaw 角速度比例增益
          long: |
            yaw 角速度内环比例增益。
            用于把期望偏航角速度与估计偏航角速度的误差转换为期望角加速度。

      FV_ANG_VEL_I_X:
        type: float
        default: 0.2
        decimal: 3
        min: 0.0
        max: 1.0
        description:
          short: roll 角速度积分增益
          long: |
            roll 角速度内环积分增益。
            用于补偿持续的 roll 角速度误差。

      FV_ANG_VEL_I_Y:
        type: float
        default: 0.2
        decimal: 3
        min: 0.0
        max: 1.0
        description:
          short: pitch 角速度积分增益
          long: |
            pitch 角速度内环积分增益。
            用于补偿持续的 pitch 角速度误差。

      FV_ANG_VEL_I_Z:
        type: float
        default: 0.1
        decimal: 3
        min: 0.0
        max: 1.0
        description:
          short: yaw 角速度积分增益
          long: |
            yaw 角速度内环积分增益。
            用于补偿持续的偏航角速度误差。

      FV_ANG_VEL_D_X:
        type: float
        default: 0.003
        decimal: 3
        min: 0.0
        max: 0.01
        description:
          short: roll 角速度微分增益
          long: |
            roll 角速度内环微分增益。
            根据 roll 角速度误差变化率抑制角加速度指令突变。

      FV_ANG_VEL_D_Y:
        type: float
        default: 0.003
        decimal: 3
        min: 0.0
        max: 0.01
        description:
          short: pitch 角速度微分增益
          long: |
            pitch 角速度内环微分增益。
            根据 pitch 角速度误差变化率抑制角加速度指令突变。

      FV_ANG_VEL_D_Z:
        type: float
        default: 0.0
        decimal: 3
        min: 0.0
        max: 0.1
        description:
          short: yaw 角速度微分增益
          long: |
            yaw 角速度内环微分增益。
            根据偏航角速度误差变化率抑制角加速度指令突变。

      FV_MASS:
        type: float
        default: 2.845
        unit: kg
        decimal: 3
        min: 0.1
        max: 50.0
        description:
          short: 飞行器质量
          long: |
            飞行器总质量。
            用于垂向推力、水平倾转角和动力学估算。

      FV_GRAVITY:
        type: float
        default: 9.8
        unit: m/s^2
        decimal: 2
        min: 1.0
        max: 20.0
        description:
          short: 重力加速度
          long: |
            控制分配中使用的重力加速度。
            用于悬停角速度和 NED 垂向加速度计算。

      FV_MOTOR_DIST:
        type: float
        default: 0.22
        unit: m
        decimal: 3
        min: 0.01
        max: 2.0
        description:
          short: 电机到机体中心距离
          long: |
            每个电机到机体中心的距离。
            用于力臂、滚转/俯仰力矩和偏航力矩估算。

      FV_K_F:
        type: float
        default: 0.00000701
        decimal: 8
        min: 0.000001
        max: 1000.0
        description:
          short: 电机推力系数
          long: |
            电机推力系数。
            用于在电机角速度平方和推力之间换算，应与仿真或实机动力模型一致。

      FV_K_M:
        type: float
        default: 0.00000013
        decimal: 8
        min: 0.0
        max: 1000.0
        description:
          short: 电机反扭矩系数
          long: |
            电机反扭矩系数。
            用于估算电机旋转产生的偏航反扭矩，应与动力模型一致。

      FV_HOVER_THR:
        type: float
        default: 0.5
        decimal: 3
        min: 0.05
        max: 0.95
        description:
          short: 悬停归一化推力
          long: |
            内部计算得到悬停角速度时对应的 actuator_motors 归一化输出。
            用于把物理角速度命令映射到 PX4 执行器输出范围。

      FV_TILT_MAX:
        type: float
        default: 0.35
        unit: rad
        decimal: 3
        min: 0.01
        max: 1.57
        description:
          short: 最大电机倾转角
          long: |
            四个倾转电机的最大机械倾转角。
            用于限制 roll/pitch/平移和 yaw 公共倾转叠加后的总倾转角，并作为 actuator_servos 归一化比例。

      FV_YAW_TILT_MAX:
        type: float
        default: 0.175
        unit: rad
        decimal: 3
        min: 0.0
        max: 1.57
        description:
          short: yaw 公共倾转限幅
          long: |
            yaw 力矩通过四个电机同向公共倾转补偿时允许的最大倾转角。
            实际使用时会被限制不超过 FV_TILT_MAX。

      FV_YAW_MIX_WT:
        type: float
        default: 0.5
        decimal: 3
        min: 0.0
        max: 1.0
        description:
          short: yaw 电机差动力矩权重
          long: |
            yaw 期望力矩中由电机反扭矩差动承担的比例，剩余部分由四舵机公共倾转承担。
            默认 0.5 表示两条通道各承担 50%，可通过地面站在 0 到 1 之间在线调整。
            0 表示 yaw 全部使用公共倾转，1 表示 yaw 全部使用电机差动。

      FV_INERTIA_XX:
        type: float
        default: 0.05892
        unit: kg m^2
        decimal: 5
        min: 0.001
        max: 10.0
        description:
          short: X 轴转动惯量
          long: |
            机体绕 X 轴的转动惯量 Ixx。
            用于 roll 方向角加速度和力矩换算。

      FV_INERTIA_YY:
        type: float
        default: 0.05892
        unit: kg m^2
        decimal: 5
        min: 0.001
        max: 10.0
        description:
          short: Y 轴转动惯量
          long: |
            机体绕 Y 轴的转动惯量 Iyy。
            用于 pitch 方向角加速度和力矩换算。

      FV_INERTIA_ZZ:
        type: float
        default: 0.11
        unit: kg m^2
        decimal: 5
        min: 0.001
        max: 10.0
        description:
          short: Z 轴转动惯量
          long: |
            机体绕 Z 轴的转动惯量 Izz。
            用于 yaw 方向角加速度和力矩换算。

      FV_J_RP:
        type: float
        default: 0.000065
        unit: kg m^2
        decimal: 6
        min: 0.0
        max: 1.0
        description:
          short: 转子螺旋桨转动惯量
          long: |
            电机转子和螺旋桨绕自身转轴的合成转动惯量。
            用于估算转子陀螺效应对 roll/pitch 动力学的影响。

      FV_ENABLE:
        type: boolean
        default: 1
        description:
          short: 启用 fullvector 控制输出
          long: |
            启用或关闭 fullvector_control 的执行器输出。
            只有该参数启用、飞机已解锁、未进入终止模式，并且当前导航状态被模块允许时，
            控制器才会发布电机和倾转舵机输出。

      FV_RC_SW_EN:
        type: boolean
        default: 1
        description:
          short: 启用遥控器控制器切换拨杆
          long: |
            启用后，fullvector_control 会读取指定 AUX 通道作为救援切换开关。
            默认状态由 fullvector 接管；拨杆达到阈值后切回 PX4 原生控制器，同时倾转舵机回中位。

      FV_RC_SW_CH:
        type: int32
        default: 5
        min: 1
        max: 6
        description:
          short: 遥控器切换 AUX 通道
          long: |
            选择 manual_control_setpoint 的 aux1 至 aux6 作为控制器切换输入。
            1 对应 aux1，6 对应 aux6。

      FV_RC_SW_THR:
        type: float
        default: 0.5
        decimal: 2
        min: -1.0
        max: 1.0
        description:
          short: 遥控器切换阈值
          long: |
            当选定 AUX 通道值大于该阈值时，请求切回 PX4 原生控制器。
            如果启用 FV_RC_SW_REV，则判定方向反转。

      FV_RC_SW_REV:
        type: boolean
        default: 0
        description:
          short: 反转遥控器切换方向
          long: |
            关闭时，高位请求 PX4 原生控制器；开启时，低位请求 PX4 原生控制器。

      FV_REL_POS_X:
        type: float
        default: 0.037
        unit: m
        decimal: 3
        min: -20.0
        max: 20.0
        description:
          short: Offboard 期望相对前向位置
          long: |
            本机机体中心在目标机 body FRD 中的期望 X 位置，正方向为目标机前方。

      FV_REL_POS_Y:
        type: float
        default: -0.403
        unit: m
        decimal: 3
        min: -20.0
        max: 20.0
        description:
          short: Offboard 期望相对右向位置
          long: |
            本机机体中心在目标机 body FRD 中的期望 Y 位置，正方向为目标机右方。

      FV_REL_POS_Z:
        type: float
        default: 0.087
        unit: m
        decimal: 3
        min: -20.0
        max: 20.0
        description:
          short: Offboard 期望相对下向位置
          long: |
            本机机体中心在目标机 body FRD 中的期望 Z 位置，正方向为目标机下方。

      FV_REL_VXY_MAX:
        type: float
        default: 0.5
        unit: m/s
        decimal: 2
        min: 0.05
        max: 2.0
        description:
          short: Offboard 相对对接水平速度上限
          long: |
            使用相对位姿对接时，位置外环生成的 NED 水平期望速度模长上限。
            该限制只作用于 Offboard 相对位姿分支，不改变定点、自稳或普通轨迹控制。

      FV_REL_AXY_MAX:
        type: float
        default: 1.0
        unit: m/s^2
        decimal: 2
        min: 0.1
        max: 5.0
        description:
          short: Offboard 相对对接水平加速度上限
          long: |
            使用相对位姿对接时，速度内环生成的 NED 水平期望加速度模长上限。
            与水平速度限制共同抑制近距离对接时的快速闭合和指令突变。

      FV_REL_LOSS_T:
        type: float
        default: 0.25
        unit: s
        decimal: 2
        min: 0.1
        max: 1.0
        description:
          short: Offboard 相对位姿失效等待时间
          long: |
            相对位姿样本超过该时间未更新时判定无效并退出相对位姿控制。
            默认 0.25 秒用于覆盖相机、PnP、DDS 和时间同步链路的正常延迟与短时抖动，
            不应作为视觉姿态长时间保持窗口。

      FV_REL_HOLD_T:
        type: float
        default: 1.5
        unit: s
        decimal: 2
        min: 0.5
        max: 10.0
        description:
          short: 对接目标丢失最长保持时间
          long: |
            对接会话中目标丢失后，允许保持丢失瞬间 NED 位置和航向的最长时间。
            超时后锁存本次对接中止并请求切回 POSCTL；离开 OFFBOARD 后才允许重新开始对接。

      FV_REL_POS_JMP:
        type: float
        default: 0.2
        unit: m
        decimal: 2
        min: 0.02
        max: 2.0
        description:
          short: 相对位置单帧基础跳变门限
          long: |
            相邻有效相对位置允许的基础跳变量。实际门限还会叠加 FV_REL_VEL_G 乘以本地接收间隔。

      FV_REL_VEL_G:
        type: float
        default: 3.0
        unit: m/s
        decimal: 2
        min: 0.1
        max: 20.0
        description:
          short: 相对位置运动学门控速度
          long: |
            用于随样本间隔扩展相对位置跳变门限；超过基础跳变加该速度乘时间的样本会被拒绝。

      FV_REL_ANG_JMP:
        type: float
        default: 0.2
        unit: rad
        decimal: 2
        min: 0.02
        max: 1.57
        description:
          short: 相对姿态单帧基础跳变门限
          long: |
            相邻有效相对四元数允许的基础旋转角跳变量。实际门限还会叠加 FV_REL_RATE_G 乘以接收间隔。

      FV_REL_RATE_G:
        type: float
        default: 2.0
        unit: rad/s
        decimal: 2
        min: 0.1
        max: 20.0
        description:
          short: 相对姿态运动学门控角速度
          long: |
            用于随样本间隔扩展相对姿态跳变门限；超过门限的四元数样本会被拒绝。

      FV_REL_ATT_MODE:
        type: enum
        values:
          0: IMU roll/pitch and relative yaw
          1: Full relative attitude (legacy)
        default: 0
        min: 0
        max: 1
        description:
          short: Offboard 相对姿态控制模式
          long: |
            0 使用 EKF/IMU 姿态保持机体 roll/pitch，仅用视觉相对姿态对齐 yaw。
            1 保留旧版逻辑，roll/pitch/yaw 全部使用视觉相对姿态；仅建议受控测试使用。

      FV_REL_ATT_GAIN:
        type: float
        default: 0.35
        decimal: 2
        min: 0.05
        max: 1.0
        description:
          short: 视觉相对姿态增益缩放
          long: |
            对由视觉相对姿态产生的期望角速度进行缩放。
            默认降低视觉外环带宽，减小相机、PnP 和传输延迟引起的相位滞后。

      FV_REL_RATE_MAX:
        type: float
        default: 0.5
        unit: rad/s
        decimal: 2
        min: 0.1
        max: 3.84
        description:
          short: 对接姿态角速度上限
          long: |
            相对对接及目标丢失保持阶段的 roll/pitch/yaw 期望角速度逐轴上限。
            默认使用 0.5 rad/s，降低首次闭环和目标重新捕获时的偏航响应速度。

      FV_REL_ACC_MAX:
        type: float
        default: 2.0
        unit: rad/s^2
        decimal: 2
        min: 0.5
        max: 20.0
        description:
          short: 对接姿态角加速度上限
          long: |
            相对对接及目标丢失保持阶段的机体系期望角加速度逐轴上限。
            默认使用 2.0 rad/s^2，抑制误差源切换和视觉跳变造成的瞬时力矩需求。

      FV_REL_MOT_DIF:
        type: float
        default: 0.25
        decimal: 2
        min: 0.05
        max: 1.0
        description:
          short: 对接电机差动比例上限
          long: |
            将姿态控制产生的 roll/pitch/yaw 电机角速度平方差动限制为垂向基准角速度平方的给定比例。
            只在相对对接或目标丢失保持阶段生效。

      FV_REL_ROLL:
        type: float
        default: 0.0
        unit: rad
        decimal: 3
        min: -3.1416
        max: 3.1416
        description:
          short: Offboard 期望相对滚转角
          long: |
            本机 body FRD 到目标机 body FRD 相对四元数所对应的期望 roll 角。

      FV_REL_PITCH:
        type: float
        default: 0.0
        unit: rad
        decimal: 3
        min: -1.5708
        max: 1.5708
        description:
          short: Offboard 期望相对俯仰角
          long: |
            本机 body FRD 到目标机 body FRD 相对四元数所对应的期望 pitch 角。

      FV_REL_YAW:
        type: float
        default: 0.0
        unit: rad
        decimal: 3
        min: -3.1416
        max: 3.1416
        description:
          short: Offboard 期望相对偏航角
          long: |
            本机 body FRD 到目标机 body FRD 相对四元数所对应的期望 yaw 角。
